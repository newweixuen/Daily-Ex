    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root { --ios-radius: 14px; --ios-radius-sm: 10px; }
        body { padding-top: 10vh; padding-bottom: 80px; }
        header.fixed-top { height: 10vh; font-size: 1.6rem; }
        .fab-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; z-index: 1000; }
        .fab { border-radius: 50% !important; width: 60px; height: 60px; font-size: 24px; }
        .fab-search { border-radius: 50% !important; width: 60px; height: 60px; font-size: 24px; display: none; align-items: center; justify-content: center; }
        .fab-search.visible { display: flex; }
        #addModal, #budgetModal, #searchModal, #confirmModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999999; justify-content: center; align-items: center; }
        #addModal.active, #budgetModal.active, #searchModal.active, #confirmModal.active { display: flex; }
        .modal-content { background: #fff; padding: 20px; border-radius: var(--ios-radius); width: 90%; max-width: 500px; }
        .item-container { display: flex; width: 100%; position: relative; touch-action: pan-y; }
        .item-content { flex: 0 0 100%; transition: transform 0.3s ease; background: #1a1d21; z-index: 2; position: relative; }
        .item-icon { width: 46px; height: 46px; flex-shrink: 0; border-radius: var(--ios-radius-sm); background: #2a2d31; font-size: 1.6rem; color: #cfd3d8; }
        .collapsed-group { display: none !important; }
        .search-status-hidden { display: none !important; }
        .summary-dot { width: 6px; height: 6px; border-radius: 50%; background: #34383e; cursor: pointer; transition: all 0.2s ease; }
        .summary-dot.active { background: #8ab4f8; width: 16px; border-radius: 3px; }

        /* Night theme */
        body { background-color: #121417; color: #e4e6eb; }
        header.fixed-top { background-color: #1a1d21 !important; color: #f2f2f2; border-color: #2a2d31 !important; }
        .list-group-item { background-color: #1a1d21; color: #e4e6eb; border-color: #2a2d31; }
        .list-group-item.bg-light { background-color: #22262b !important; color: #e4e6eb; }
        .text-muted { color: #9aa0a6 !important; }
        .modal-content { background-color: #1a1d21; color: #e4e6eb; }
        .form-control, .form-select { background-color: #22262b; color: #e4e6eb; border-color: #34383e; }
        .form-control:focus, .form-select:focus { background-color: #22262b; color: #e4e6eb; }
        .btn-close { filter: invert(1) grayscale(100%) brightness(200%); }
        .btn { border-radius: var(--ios-radius-sm); }
        .form-control, .form-select { border-radius: var(--ios-radius-sm); }

        /* Keep line-length readable on wide screens so rows are easy to track */
        @media (min-width: 768px) {
            .container { max-width: 600px; }
        }

        /* Small gap between item rows instead of zebra striping, so rows read as separate cards */
        .list-group { gap: 2px; }
        ul.list-group .list-group-item { border: none !important; border-radius: var(--ios-radius) !important; margin: 1px 0 !important; -webkit-mask-image: -webkit-radial-gradient(white, black); }

        /* Anchor the amount with a divider so it's easy to match to its row */
        .item-amount { min-width: 88px; text-align: right; border-left: 1px solid #2a2d31; padding-left: 10px; margin-right: 16px; }
        .item-actions { position: absolute; right: 0; top: 0; height: 100%; width: 100px; display: flex; z-index: 1; }
        .swiped .item-content { transform: translateX(-100px); }
        .swiped .item-actions { transform: translateX(0); }

        /* Insights summary table: give rows a small gap and rounded corners, iOS-style */
        .insights-table { border-collapse: separate; border-spacing: 0 6px; }
        .insights-table th { border: none; padding: 8px 12px; background-color: #22262b; }
        .insights-table td { border: none; padding: 10px 12px; background-color: #1a1d21; }
        .insights-table thead th:first-child, .insights-table tbody td:first-child, .insights-table tfoot td:first-child { border-top-left-radius: var(--ios-radius-sm); border-bottom-left-radius: var(--ios-radius-sm); }
        .insights-table thead th:last-child, .insights-table tbody td:last-child, .insights-table tfoot td:last-child { border-top-right-radius: var(--ios-radius-sm); border-bottom-right-radius: var(--ios-radius-sm); }
        .insights-table tfoot td { background-color: #22262b; }

        /* Date group header row */
        .date-group > .list-group-item.bg-light { border-radius: var(--ios-radius) !important; }
    </style>

<body>

<div id="lockScreen" style="position:fixed; inset:0; background:#121417; z-index:999999999; display:flex; align-items:center; justify-content:center;">
    <div style="width:85%; max-width:320px; text-align:center;">
        <div style="font-size:2.5rem; margin-bottom:12px;">🔒</div>
        <h5 class="mb-3" style="color:#e4e6eb;">Enter PIN</h5>
        <input type="password" id="lockPinInput" class="form-control mb-2 text-center" placeholder="PIN" autocomplete="off" inputmode="text" onkeydown="if(event.key==='Enter'){attemptUnlock();}">
        <div id="lockErrorMsg" class="text-danger small mb-3" style="display:none;">Incorrect PIN. Try again.</div>
        <button class="btn btn-primary w-100" onclick="attemptUnlock()">Unlock</button>
    </div>
</div>

<header class="fixed-top bg-light border-bottom d-flex align-items-center justify-content-center fw-bold">🧾 Daily Expense</header>

<div class="container mt-2">
    <div class="d-flex gap-2">
        <button id="btnExpenses" class="btn btn-outline-primary flex-fill" onclick="showSection('expenses')"><i class="bi bi-list-task"></i> Expenses</button>
        <button id="btnInsights" class="btn btn-outline-primary flex-fill" onclick="showSection('insights')"><i class="bi bi-graph-up-arrow"></i> Insights</button>
    </div>
    <div id="content" class="mt-3 text-center">
        <p class="text-muted small mt-5">Choose a tab above to get started, or tap the + button below to add an expense.</p>
    </div>
</div>

<div class="fab-container">
    <button id="searchFab" class="btn btn-secondary fab-search" onclick="openSearchModal()"><i class="bi bi-search"></i></button>
    <button class="btn btn-primary fab" onclick="openModal()"><i class="bi bi-plus-lg"></i></button>
</div>

<div id="addModal">
    <div class="modal-content shadow">
        <div class="d-flex justify-content-between mb-3"><h5>Entry</h5><button class="btn-close" onclick="closeModal()"></button></div>
        <form id="expenseForm">
            <div class="input-group mb-2">
                <button type="button" class="btn btn-outline-secondary" onclick="shiftDate(-1)"><i class="bi bi-chevron-left"></i></button>
                <input type="date" id="date" class="form-control text-center" required>
                <button type="button" class="btn btn-outline-secondary" onclick="shiftDate(1)"><i class="bi bi-chevron-right"></i></button>
                <button type="button" class="btn btn-outline-primary" onclick="setToday()">Today</button>
            </div>
            <select id="category" class="form-select mb-2" required>
                <optgroup label="Income">
                    <option value="Income">💵 Income</option>
                </optgroup>
                <optgroup label="Expense Categories">
                    <option value="Restaurant & Drinks" selected>🍽️ Restaurant & Drinks</option>
                    <option value="Medical">💊 Medical</option>
                    <option value="Grocery">🛒 Grocery</option>
                    <option value="Entertainment">🎮 Entertainment</option>
                    <option value="Transportation">🚌 Transportation</option>
                    <option value="Utilities">💡 Utilities</option>
                    <option value="Housing Rental">🏠 Housing Rental</option>
                    <option value="Parents">👪 Parents</option>
                    <option value="Loan">💰 Loan</option>
                    <option value="Travel">✈️ Travel</option>
                    <option value="Others">🏷️ Others</option>
                </optgroup>
            </select>
            <input type="text" id="desc" class="form-control mb-2" placeholder="Description" required>
            <label class="form-label small text-muted mb-1">Currency</label>
            <input type="text" id="currency" class="form-control mb-2" list="currencyOptions" placeholder="SGD" maxlength="3" style="text-transform:uppercase;" required>
            <datalist id="currencyOptions">
                <option value="SGD">
                <option value="USD">
                <option value="EUR">
                <option value="GBP">
                <option value="JPY">
                <option value="MYR">
                <option value="AUD">
                <option value="CNY">
                <option value="HKD">
                <option value="THB">
                <option value="IDR">
                <option value="KRW">
                <option value="INR">
            </datalist>
            <input type="number" id="amount" class="form-control mb-3" placeholder="Amount" required>
            <button type="button" class="btn btn-primary w-100" onclick="submitExpense()">Save</button>
        </form>
    </div>
</div>

<div id="budgetModal">
    <div class="modal-content shadow">
        <div class="d-flex justify-content-between mb-3"><h5>Monthly Budgets</h5><button class="btn-close" onclick="closeBudgetModal()"></button></div>
        <div id="budgetFields" class="text-start"></div>
        <button type="button" class="btn btn-primary w-100 mt-2" onclick="saveBudgets()">Save</button>
        <p class="text-muted small mt-2 mb-0">Budgets are in SGD and saved on this device/browser only.</p>
    </div>
</div>

<div id="searchModal">
    <div class="modal-content shadow text-start">
        <div class="d-flex justify-content-between mb-3"><h5>Search Expenses</h5><button class="btn-close" onclick="closeSearchModal()"></button></div>
        <input type="text" id="searchText" class="form-control mb-3" placeholder="Search description...">
        <label class="form-label small text-muted mb-1">Category</label>
        <div id="searchCategoryList" class="d-flex flex-wrap gap-2 mb-3"></div>
        <label class="form-label small text-muted mb-1">Amount</label>
        <select id="searchAmountMode" class="form-select mb-2" onchange="updateAmountFieldsVisibility()">
            <option value="any">Any amount</option>
            <option value="gt">More than</option>
            <option value="lt">Less than</option>
            <option value="between">Within range</option>
        </select>
        <div class="d-flex gap-2 mb-3">
            <input type="number" id="searchAmountMin" class="form-control" placeholder="Min" style="display:none;">
            <input type="number" id="searchAmountMax" class="form-control" placeholder="Max" style="display:none;">
        </div>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary flex-fill" onclick="clearSearch()">Clear</button>
            <button type="button" class="btn btn-primary flex-fill" onclick="applySearch()">Apply</button>
        </div>
    </div>
</div>

<div id="confirmModal">
    <div class="modal-content shadow text-start">
        <div id="confirmModalMessage" class="mb-3"></div>
        <div class="d-flex gap-2">
            <button type="button" id="confirmModalCancelBtn" class="btn btn-outline-secondary flex-fill" onclick="resolveConfirmModal(false)">Cancel</button>
            <button type="button" id="confirmModalOkBtn" class="btn btn-primary flex-fill" onclick="resolveConfirmModal(true)">OK</button>
        </div>
    </div>
</div>

<script>
    const url = "https://script.google.com/macros/s/AKfycbz-AV7OUJN5QrRpt9XmZwpBmhJbUbLbYo3j_91TdA4VU7u1JhiZ-ke4QBcctOv1r_hD/exec";
    let editingRowId = null;
    let currentSection = 'expenses';

    // ---------- Access control ----------
    // Anyone with this page's URL can view its source and find the `url` above, so the
    // Apps Script backend requires a matching secret token on every request (see Code.gs).
    // The PIN entered here IS that token — a wrong PIN simply means every request the
    // backend receives gets rejected, rather than relying on hiding the page itself.
    const ACCESS_TOKEN_KEY = 'dailyExpenseAccessToken';
    let accessToken = null;

    async function validateToken(token) {
        try {
            const res = await fetch(`${url}?token=${encodeURIComponent(token)}`);
            const data = await res.json();
            return Array.isArray(data); // backend returns an array on success, {error:...} otherwise
        } catch (e) {
            console.error('Token validation failed:', e);
            return false;
        }
    }

    function showLockScreen() {
        document.getElementById('lockScreen').style.display = 'flex';
    }

    function hideLockScreen() {
        document.getElementById('lockScreen').style.display = 'none';
    }

    async function attemptUnlock() {
        const pin = document.getElementById('lockPinInput').value;
        const errorMsg = document.getElementById('lockErrorMsg');
        errorMsg.style.display = 'none';
        if (!pin) return;
        const valid = await validateToken(pin);
        if (valid) {
            accessToken = pin;
            try { localStorage.setItem(ACCESS_TOKEN_KEY, pin); } catch (e) {}
            hideLockScreen();
        } else {
            errorMsg.style.display = 'block';
        }
    }

    async function initAccess() {
        let cached = null;
        try { cached = localStorage.getItem(ACCESS_TOKEN_KEY); } catch (e) {}
        if (cached) {
            const valid = await validateToken(cached);
            if (valid) {
                accessToken = cached;
                hideLockScreen();
                return;
            }
            try { localStorage.removeItem(ACCESS_TOKEN_KEY); } catch (e) {}
        }
        showLockScreen();
    }

    // ---------- Search ----------
    let searchCriteria = { text: '', categories: [], amountMode: 'any', amountMin: null, amountMax: null };

    function isSearchActive() {
        return searchCriteria.text.trim() !== '' || searchCriteria.categories.length > 0 || searchCriteria.amountMode !== 'any';
    }

    function matchesSearch(row) {
        const needle = searchCriteria.text.trim().toLowerCase();
        if (needle !== '') {
            const desc = (row.Description || '').toString().toLowerCase();
            const isTextMatch = desc.indexOf(needle) !== -1;
            if (!isTextMatch) return false;
        }
        if (searchCriteria.categories.length > 0) {
            const isCategoryMatch = searchCriteria.categories.indexOf(row.Category) !== -1;
            if (!isCategoryMatch) return false;
        }
        const amt = parseFloat(row.Amount);
        if (searchCriteria.amountMode === 'gt' && searchCriteria.amountMin != null) {
            if (!(amt > searchCriteria.amountMin)) return false;
        } else if (searchCriteria.amountMode === 'lt' && searchCriteria.amountMax != null) {
            if (!(amt < searchCriteria.amountMax)) return false;
        } else if (searchCriteria.amountMode === 'between' && searchCriteria.amountMin != null && searchCriteria.amountMax != null) {
            if (!(amt >= searchCriteria.amountMin && amt <= searchCriteria.amountMax)) return false;
        }
        return true;
    }

    function buildSearchSummary() {
        const parts = [];
        if (searchCriteria.text.trim()) parts.push(`"${searchCriteria.text.trim()}"`);
        if (searchCriteria.categories.length > 0) parts.push(searchCriteria.categories.join(', '));
        if (searchCriteria.amountMode === 'gt' && searchCriteria.amountMin != null) parts.push(`> ${HOME_CURRENCY} ${searchCriteria.amountMin}`);
        if (searchCriteria.amountMode === 'lt' && searchCriteria.amountMax != null) parts.push(`< ${HOME_CURRENCY} ${searchCriteria.amountMax}`);
        if (searchCriteria.amountMode === 'between' && searchCriteria.amountMin != null && searchCriteria.amountMax != null) parts.push(`${HOME_CURRENCY} ${searchCriteria.amountMin}–${searchCriteria.amountMax}`);
        return parts.join(' • ');
    }

    function updateSearchFabVisibility() {
        const btn = document.getElementById('searchFab');
        if (!btn) return;
        btn.classList.toggle('visible', currentSection === 'expenses');
    }

    function updateSearchFabState() {
        const btn = document.getElementById('searchFab');
        if (!btn) return;
        btn.classList.toggle('btn-primary', isSearchActive());
        btn.classList.toggle('btn-secondary', !isSearchActive());
    }

    function buildCategoryChips() {
        let html = '';
        CATEGORY_LIST.forEach(c => {
            const active = searchCriteria.categories.includes(c);
            html += `<button type="button" class="btn btn-sm ${active ? 'btn-primary' : 'btn-outline-secondary'}" onclick="toggleSearchCategory('${c.replace(/'/g, "\\'")}')">${getCategoryIcon(c)} ${c}</button>`;
        });
        document.getElementById('searchCategoryList').innerHTML = html;
    }

    function toggleSearchCategory(cat) {
        const idx = searchCriteria.categories.indexOf(cat);
        if (idx === -1) searchCriteria.categories.push(cat);
        else searchCriteria.categories.splice(idx, 1);
        buildCategoryChips();
    }

    function updateAmountFieldsVisibility() {
        const mode = document.getElementById('searchAmountMode').value;
        const minField = document.getElementById('searchAmountMin');
        const maxField = document.getElementById('searchAmountMax');
        minField.style.display = (mode === 'gt' || mode === 'between') ? 'block' : 'none';
        maxField.style.display = (mode === 'lt' || mode === 'between') ? 'block' : 'none';
        minField.placeholder = mode === 'between' ? 'Min' : 'Amount';
        maxField.placeholder = mode === 'between' ? 'Max' : 'Amount';
    }

    function openSearchModal() {
        document.getElementById('searchText').value = searchCriteria.text;
        document.getElementById('searchAmountMode').value = searchCriteria.amountMode;
        document.getElementById('searchAmountMin').value = searchCriteria.amountMin != null ? searchCriteria.amountMin : '';
        document.getElementById('searchAmountMax').value = searchCriteria.amountMax != null ? searchCriteria.amountMax : '';
        buildCategoryChips();
        updateAmountFieldsVisibility();
        document.getElementById('searchModal').classList.add('active');
    }

    function closeSearchModal() {
        document.getElementById('searchModal').classList.remove('active');
    }

    function applySearch() {
        searchCriteria.text = document.getElementById('searchText').value;
        searchCriteria.amountMode = document.getElementById('searchAmountMode').value;
        const minVal = parseFloat(document.getElementById('searchAmountMin').value);
        const maxVal = parseFloat(document.getElementById('searchAmountMax').value);
        searchCriteria.amountMin = isNaN(minVal) ? null : minVal;
        searchCriteria.amountMax = isNaN(maxVal) ? null : maxVal;
        closeSearchModal();
        updateSearchFabState();
        renderExpensesFromCache();
    }

    function clearSearch() {
        searchCriteria = { text: '', categories: [], amountMode: 'any', amountMin: null, amountMax: null };
        document.getElementById('searchText').value = '';
        document.getElementById('searchAmountMode').value = 'any';
        document.getElementById('searchAmountMin').value = '';
        document.getElementById('searchAmountMax').value = '';
        buildCategoryChips();
        updateAmountFieldsVisibility();
        updateSearchFabState();
        closeSearchModal();
        const statusBar = document.getElementById('searchStatusBar');
        if (statusBar) statusBar.classList.add('search-status-hidden');
        renderExpensesFromCache();
    }

    // Custom confirm/alert modal — native confirm()/alert()/prompt() are silently
    // disabled when this app is launched from an iOS home-screen icon (standalone mode),
    // which is why delete and validation messages didn't work there. This works everywhere.
    let confirmModalResolve = null;

    function showConfirm(message, options) {
        options = options || {};
        const showCancel = options.showCancel !== false;
        document.getElementById('confirmModalMessage').textContent = message;
        document.getElementById('confirmModalOkBtn').textContent = options.okText || 'OK';
        const cancelBtn = document.getElementById('confirmModalCancelBtn');
        cancelBtn.textContent = options.cancelText || 'Cancel';
        cancelBtn.style.display = showCancel ? '' : 'none';
        document.getElementById('confirmModal').classList.add('active');
        return new Promise(resolve => { confirmModalResolve = resolve; });
    }

    function showAlert(message) {
        return showConfirm(message, { showCancel: false });
    }

    function resolveConfirmModal(result) {
        document.getElementById('confirmModal').classList.remove('active');
        if (confirmModalResolve) {
            const resolve = confirmModalResolve;
            confirmModalResolve = null;
            resolve(result);
        }
    }

    function pendingNotice() {
        showAlert('This entry is still saving — please wait a moment before editing or deleting it.');
    }

    function openModal(item = null) {
        if (item) {
            editingRowId = item.rowId;
            document.getElementById('date').value = toLocalDateKey(item.Date);
            document.getElementById('category').value = item.Category;
            document.getElementById('desc').value = item.Description;
            document.getElementById('currency').value = item.Currency || HOME_CURRENCY;
            document.getElementById('amount').value = item.Amount;
        } else {
            editingRowId = null;
            document.getElementById('expenseForm').reset();
            document.getElementById('date').value = toLocalDateKey(new Date());
            document.getElementById('currency').value = HOME_CURRENCY;
        }
        document.getElementById('addModal').classList.add('active');
    }

    function shiftDate(days) {
        const dateInput = document.getElementById('date');
        const base = dateInput.value ? new Date(dateInput.value + 'T00:00:00') : new Date();
        base.setDate(base.getDate() + days);
        dateInput.value = toLocalDateKey(base);
    }

    function setToday() {
        document.getElementById('date').value = toLocalDateKey(new Date());
    }

    function closeModal() { document.getElementById('addModal').classList.remove('active'); }

    async function submitExpense() {
        const date = document.getElementById('date').value;
        const category = document.getElementById('category').value;
        const desc = document.getElementById('desc').value.trim();
        const currency = document.getElementById('currency').value.trim().toUpperCase();
        const amount = document.getElementById('amount').value;

        if (!date || !category || !desc || !currency || !amount) {
            showAlert('Please fill in all fields before saving.');
            return;
        }

        const isEdit = !!editingRowId;
        const payload = {
            action: isEdit ? 'edit' : 'add',
            rowId: editingRowId,
            date: date,
            category: category,
            description: desc,
            currency: currency,
            amount: amount,
            token: accessToken
        };

        closeModal();
        if (!window.expenseData) window.expenseData = [];

        let tempId = null;
        if (isEdit) {
            // Update in place instantly — we already know the real rowId
            const idx = window.expenseData.findIndex(r => r.rowId == editingRowId);
            const updatedRow = { rowId: editingRowId, Date: date, Category: category, Description: desc, Amount: amount, Currency: currency };
            if (idx !== -1) window.expenseData[idx] = updatedRow;
            else window.expenseData.push(updatedRow);
        } else {
            // Insert instantly with a temporary id, marked "pending" until the server confirms it
            tempId = 'temp-' + Date.now();
            window.expenseData.push({ rowId: tempId, Date: date, Category: category, Description: desc, Amount: amount, Currency: currency, pending: true });
        }
        renderCurrentSectionFromCache(); // instant re-render from local cache, no network wait

        try {
            await fetch(url, { method: 'POST', body: JSON.stringify(payload) });
            // Reconcile with the server (assigns the real rowId for new entries, clears "pending")
            showSection(currentSection, true);
        } catch (e) {
            console.error('Save failed:', e);
            if (tempId) {
                const idx = window.expenseData.findIndex(r => r.rowId === tempId);
                if (idx !== -1) window.expenseData.splice(idx, 1);
            }
            showAlert('Could not save to Google Sheets — please check your connection and try again.');
            renderCurrentSectionFromCache();
        }
    }

    const HOME_CURRENCY = 'SGD'; // used for all totals/charts/budgets, since summing mixed currencies isn't valid without FX rates

    // Sum expense items grouped by currency, formatted as "SGD 45.00 · USD 20.00"
    // so mixed-currency days are shown correctly instead of wrongly summed together.
    function formatMultiCurrencySubtotal(items) {
        const byCurrency = {};
        items.filter(r => r.Category !== 'Income').forEach(r => {

    // ---------- Currency conversion (historical daily rates via frankfurter.app, free/no key) ----------
    const fxRateCache = {}; // key: "yyyy-mm-dd_CUR" -> rate to HOME_CURRENCY (number) or null if unavailable
    let fxUsedStaticFallback = false; // true if any conversion had to fall back to the static rate table below

    // Rough reference rates to SGD, only used if every live API attempt fails. Not live-accurate.
    const STATIC_FALLBACK_RATES_TO_SGD = {
        USD: 1.34, EUR: 1.45, GBP: 1.70, JPY: 0.0091, MYR: 0.29, AUD: 0.87,
        CNY: 0.185, HKD: 0.172, THB: 0.037, IDR: 0.000083, KRW: 0.00097, INR: 0.016
    };

    // Uses the average daily rate over the 30 days ending on the transaction date,
    // rather than the single day's rate, to smooth out day-to-day FX noise.
    async function getFxRateAverage(dateKey, currency) {
        if (currency === HOME_CURRENCY) return 1;
        const cacheKey = dateKey + '_' + currency;
        if (Object.prototype.hasOwnProperty.call(fxRateCache, cacheKey)) return fxRateCache[cacheKey];

        // Tier 1: 30-day average rate (frankfurter.app date-range query)
        try {
            const endDate = new Date(dateKey + 'T00:00:00');
            const startDate = new Date(endDate);
            startDate.setDate(startDate.getDate() - 30);
            const startKey = toLocalDateKey(startDate);
            const res = await fetch(`https://api.frankfurter.app/${startKey}..${dateKey}?from=${currency}&to=${HOME_CURRENCY}`);
            if (res.ok) {
                const data = await res.json();
                if (data && data.rates) {
                    const values = Object.values(data.rates)
                        .map(dayRates => dayRates[HOME_CURRENCY])
                        .filter(v => typeof v === 'number');
                    if (values.length > 0) {
                        const rate = values.reduce((a, b) => a + b, 0) / values.length;
                        fxRateCache[cacheKey] = rate;
                        return rate;
                    }
                }
                console.warn(`FX tier 1 (30-day average) returned no usable rates for ${currency}->${HOME_CURRENCY} on ${dateKey}`);
            } else {
                console.warn(`FX tier 1 (30-day average) HTTP ${res.status} for ${currency}->${HOME_CURRENCY}`);
            }
        } catch (e) {
            console.warn(`FX tier 1 (30-day average) failed for ${currency}->${HOME_CURRENCY}:`, e);
        }

        // Tier 2: exact single-date rate (frankfurter.app)
        try {
            const res = await fetch(`https://api.frankfurter.app/${dateKey}?from=${currency}&to=${HOME_CURRENCY}`);
            if (res.ok) {
                const data = await res.json();
                if (data && data.rates && typeof data.rates[HOME_CURRENCY] === 'number') {
                    const rate = data.rates[HOME_CURRENCY];
                    fxRateCache[cacheKey] = rate;
                    return rate;
                }
                console.warn(`FX tier 2 (single date) returned no usable rate for ${currency}->${HOME_CURRENCY} on ${dateKey}`);
            } else {
                console.warn(`FX tier 2 (single date) HTTP ${res.status} for ${currency}->${HOME_CURRENCY}`);
            }
        } catch (e) {
            console.warn(`FX tier 2 (single date) failed for ${currency}->${HOME_CURRENCY}:`, e);
        }

        // Tier 3: latest available rate (frankfurter.app) — better than nothing if history isn't available
        try {
            const res = await fetch(`https://api.frankfurter.app/latest?from=${currency}&to=${HOME_CURRENCY}`);
            if (res.ok) {
                const data = await res.json();
                if (data && data.rates && typeof data.rates[HOME_CURRENCY] === 'number') {
                    const rate = data.rates[HOME_CURRENCY];
                    fxRateCache[cacheKey] = rate;
                    return rate;
                }
                console.warn(`FX tier 3 (latest, frankfurter) returned no usable rate for ${currency}->${HOME_CURRENCY}`);
            } else {
                console.warn(`FX tier 3 (latest, frankfurter) HTTP ${res.status} for ${currency}->${HOME_CURRENCY}`);
            }
        } catch (e) {
            console.warn(`FX tier 3 (latest, frankfurter) failed for ${currency}->${HOME_CURRENCY}:`, e);
        }

        // Tier 4: different provider entirely, in case frankfurter.app itself is unreachable (network/CORS/outage)
        try {
            const res = await fetch(`https://open.er-api.com/v6/latest/${currency}`);
            if (res.ok) {
                const data = await res.json();
                if (data && data.rates && typeof data.rates[HOME_CURRENCY] === 'number') {
                    const rate = data.rates[HOME_CURRENCY];
                    fxRateCache[cacheKey] = rate;
                    return rate;
                }
                console.warn(`FX tier 4 (open.er-api.com) returned no usable rate for ${currency}->${HOME_CURRENCY}`);
            } else {
                console.warn(`FX tier 4 (open.er-api.com) HTTP ${res.status} for ${currency}->${HOME_CURRENCY}`);
            }
        } catch (e) {
            console.warn(`FX tier 4 (open.er-api.com) failed for ${currency}->${HOME_CURRENCY}:`, e);
        }

        // Tier 5: static approximate rates as an absolute last resort — works even if every
        // live API call above is blocked (e.g. by file:// origin restrictions or being offline).
        // These are rough reference points, not live rates, and are flagged as such in the UI.
        if (Object.prototype.hasOwnProperty.call(STATIC_FALLBACK_RATES_TO_SGD, currency)) {
            console.warn(`FX tiers 1-4 all failed for ${currency}->${HOME_CURRENCY}; using static fallback rate.`);
            fxUsedStaticFallback = true;
            const rate = STATIC_FALLBACK_RATES_TO_SGD[currency];
            fxRateCache[cacheKey] = rate;
            return rate;
        }

        console.error(`All FX rate sources failed for ${currency}->${HOME_CURRENCY} (date ${dateKey}). This entry will be excluded from converted totals.`);
        fxRateCache[cacheKey] = null;
        return null;
    }

    // Converts every row to HOME_CURRENCY using the FX rate on that row's own transaction date.
    // Returns rows with an added ConvertedAmount field (null if a rate couldn't be fetched).
    async function convertRowsToHomeCurrency(rows) {
        const uniqueCombos = new Set();
        rows.forEach(r => {
            const cur = r.Currency || HOME_CURRENCY;
            if (cur !== HOME_CURRENCY) uniqueCombos.add(toLocalDateKey(r.Date) + '_' + cur);
        });
        await Promise.all(Array.from(uniqueCombos).map(combo => {
            const idx = combo.lastIndexOf('_');
            const dateKey = combo.slice(0, idx);
            const cur = combo.slice(idx + 1);
            return getFxRateAverage(dateKey, cur);
        }));
        return rows.map(r => {
            const cur = r.Currency || HOME_CURRENCY;
            const amt = parseFloat(r.Amount);
            if (cur === HOME_CURRENCY) return Object.assign({}, r, { ConvertedAmount: amt });
            const cacheKey = toLocalDateKey(r.Date) + '_' + cur;
            const rate = fxRateCache[cacheKey];
            return Object.assign({}, r, { ConvertedAmount: (rate != null) ? amt * rate : null });
        });
    }

    // ---------- Summary swiper (3 pages: home currency / other currencies / converted to home) ----------
    let summaryPageState = { exp: 1, ins: 1 }; // 0=Converted(overall SGD) 1=SGD summary (default) 2=Other currencies

    function updateSummaryDots(prefix, idx) {
        const dotsContainer = document.getElementById(prefix + 'SummaryDots');
        if (!dotsContainer) return;
        Array.from(dotsContainer.children).forEach((dot, i) => dot.classList.toggle('active', i === idx));
    }

    // Sets the swiper wrapper's height to match only the currently active page,
    // instead of the flex row's default of stretching all pages to the tallest one.
    function updateSummaryWrapHeight(prefix) {
        const wrap = document.getElementById(prefix + 'SummaryWrap');
        const track = document.getElementById(prefix + 'SummaryTrack');
        if (!wrap || !track) return;
        const activePage = track.children[summaryPageState[prefix]];
        if (activePage) wrap.style.height = activePage.scrollHeight + 'px';
    }

    function goToSummaryPage(prefix, idx) {
        const track = document.getElementById(prefix + 'SummaryTrack');
        if (!track) return;
        idx = Math.max(0, Math.min(2, idx));
        summaryPageState[prefix] = idx;
        track.style.transition = 'transform 0.3s ease';
        track.style.transform = `translateX(-${idx * 100}%)`;
        updateSummaryDots(prefix, idx);
        updateSummaryWrapHeight(prefix);
        if (prefix === 'ins') applyInsightsChartForPage(idx);
    }

    function attachSummarySwipeHandlers(prefix) {
        const wrap = document.getElementById(prefix + 'SummaryWrap');
        const track = document.getElementById(prefix + 'SummaryTrack');
        if (!wrap || !track) return;
        wrap.style.transition = 'height 0.3s ease';
        track.style.alignItems = 'flex-start';
        let startX = 0, startY = 0, dragging = false, horizontalLock = false, moved = false;

        wrap.addEventListener('touchstart', function (e) {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            dragging = true;
            horizontalLock = false;
            moved = false;
            track.style.transition = 'none';
        }, { passive: true });

        wrap.addEventListener('touchmove', function (e) {
            if (!dragging) return;
            const touch = e.touches[0];
            const dx = touch.clientX - startX;
            const dy = touch.clientY - startY;
            if (!horizontalLock) {
                if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
                horizontalLock = Math.abs(dx) > Math.abs(dy);
                if (!horizontalLock) return;
            }
            moved = true;
            e.preventDefault();
            const basePercent = -summaryPageState[prefix] * 100;
            track.style.transform = `translateX(calc(${basePercent}% + ${dx}px))`;
        }, { passive: false });

        wrap.addEventListener('touchend', function (e) {
            if (!dragging) return;
            dragging = false;
            if (!moved || !horizontalLock) {
                goToSummaryPage(prefix, summaryPageState[prefix]);
                return;
            }
            const touch = e.changedTouches[0];
            const dx = touch.clientX - startX;
            let idx = summaryPageState[prefix];
            if (dx < -50 && idx < 2) idx++;
            else if (dx > 50 && idx > 0) idx--;
            goToSummaryPage(prefix, idx);
        }, { passive: true });

        // Restore whatever page the user was on, instantly (no animation) on rebuild
        track.style.transition = 'none';
        track.style.transform = `translateX(-${summaryPageState[prefix] * 100}%)`;
        updateSummaryDots(prefix, summaryPageState[prefix]);
        updateSummaryWrapHeight(prefix);
    }

    // Page 2 content: per-currency breakdown for everything NOT in the home currency
    async function renderOtherCurrenciesSummary(containerId, periodRows) {
        const container = document.getElementById(containerId);
        if (!container) return;
        const foreignRows = periodRows.filter(r => (r.Currency || HOME_CURRENCY) !== HOME_CURRENCY);
        if (foreignRows.length === 0) {
            container.innerHTML = `<p class="text-muted small mt-4">No other-currency entries in this period.</p>`;
            updateSummaryWrapHeight(containerId.startsWith('exp') ? 'exp' : 'ins');
            return;
        }
        const byCurrency = {};
        foreignRows.forEach(r => {
            const cur = r.Currency;
            if (!byCurrency[cur]) byCurrency[cur] = { expense: 0, income: 0 };
            const amt = parseFloat(r.Amount);
            if (r.Category === 'Income') byCurrency[cur].income += amt;
            else byCurrency[cur].expense += amt;
        });
        let html = '';
        Object.keys(byCurrency).sort().forEach(cur => {
            const { expense, income } = byCurrency[cur];
            const net = income - expense;
            html += `<div class="p-3 mb-2" style="background:#1a1d21; border-radius: var(--ios-radius);">
                <div class="fw-bold mb-2">${cur}</div>
                <div class="d-flex justify-content-between small mb-1"><span class="text-muted">Expenses</span><span style="color:#F87171;">${cur} ${expense.toFixed(2)}</span></div>
                <div class="d-flex justify-content-between small mb-1"><span class="text-muted">Income</span><span style="color:#34D399;">${cur} ${income.toFixed(2)}</span></div>
                <div class="d-flex justify-content-between small fw-bold mb-1"><span>Net</span><span style="color:${net >= 0 ? '#34D399' : '#F87171'};">${net >= 0 ? '+' : '−'}${cur} ${Math.abs(net).toFixed(2)}</span></div>
                <div class="d-flex justify-content-between small text-muted"><span>≈ in ${HOME_CURRENCY}</span><span id="${containerId}-fx-${cur}">…</span></div>
            </div>`;
        });
        container.innerHTML = html;
        updateSummaryWrapHeight(containerId.startsWith('exp') ? 'exp' : 'ins');

        // Fill in the SGD-converted net per currency once rates resolve (converts each row on
        // its own date, then sums — more accurate than converting a single blended amount).
        try {
            const converted = await convertRowsToHomeCurrency(foreignRows);
            const convNetByCurrency = {};
            converted.forEach(r => {
                const cur = r.Currency;
                if (!(cur in convNetByCurrency)) convNetByCurrency[cur] = 0;
                if (r.ConvertedAmount != null) {
                    convNetByCurrency[cur] += (r.Category === 'Income' ? r.ConvertedAmount : -r.ConvertedAmount);
                }
            });
            Object.keys(byCurrency).forEach(cur => {
                const el = document.getElementById(`${containerId}-fx-${cur}`);
                if (!el) return; // page may have re-rendered since this started
                const val = convNetByCurrency[cur];
                if (val == null || isNaN(val)) {
                    el.textContent = 'N/A';
                    return;
                }
                el.textContent = (val >= 0 ? '+' : '−') + `${HOME_CURRENCY} ${Math.abs(val).toFixed(2)}`;
                el.style.color = val >= 0 ? '#34D399' : '#F87171';
            });
        } catch (e) {
            console.error('Other-currency SGD conversion failed:', e);
        }
    }

    // Page 3 content: everything converted to HOME_CURRENCY using the 1-month average rate ending on each entry's transaction date
    async function renderConvertedSummary(periodRows, ids) {
        const expEl = document.getElementById(ids.exp);
        const incEl = document.getElementById(ids.inc);
        const savEl = document.getElementById(ids.sav);
        const noteEl = ids.note ? document.getElementById(ids.note) : null;
        if (!expEl || !incEl || !savEl) return null;
        const prefix = ids.exp.startsWith('ins') ? 'ins' : 'exp';

        expEl.textContent = '…';
        incEl.textContent = '…';
        savEl.textContent = '…';
        if (noteEl) noteEl.textContent = 'Fetching exchange rates…';
        fxUsedStaticFallback = false;

        try {
            const converted = await convertRowsToHomeCurrency(periodRows);
            const expenseTotal = converted.filter(r => r.Category !== 'Income' && r.ConvertedAmount != null).reduce((s, r) => s + r.ConvertedAmount, 0);
            const incomeTotal = converted.filter(r => r.Category === 'Income' && r.ConvertedAmount != null).reduce((s, r) => s + r.ConvertedAmount, 0);
            const savings = incomeTotal - expenseTotal;
            const missingCount = converted.filter(r => r.ConvertedAmount == null).length;

            expEl.textContent = `≈ ${HOME_CURRENCY} ${expenseTotal.toFixed(2)}`;
            incEl.textContent = `≈ ${HOME_CURRENCY} ${incomeTotal.toFixed(2)}`;
            savEl.textContent = (savings >= 0 ? '+' : '−') + `≈ ${HOME_CURRENCY} ${Math.abs(savings).toFixed(2)}`;
            savEl.style.color = savings >= 0 ? '#34D399' : '#F87171';

            if (noteEl) {
                let noteText = fxUsedStaticFallback
                    ? `⚠️ Live exchange rates were unreachable — using approximate reference rates instead.`
                    : `Converted using each entry's 1-month average exchange rate.`;
                if (missingCount > 0) {
                    noteText += ` ${missingCount} ${missingCount === 1 ? 'entry' : 'entries'} couldn't be converted.`;
                }
                noteEl.textContent = noteText;
            }
            updateSummaryWrapHeight(prefix);
            return converted;
        } catch (e) {
            console.error('Currency conversion failed:', e);
            expEl.textContent = 'N/A';
            incEl.textContent = 'N/A';
            savEl.textContent = 'N/A';
            if (noteEl) noteEl.textContent = 'Could not fetch exchange rates right now.';
            updateSummaryWrapHeight(prefix);
            return null;
        }
    }

    function toLocalDateKey(dateInput) {
        const d = (dateInput instanceof Date) ? dateInput : new Date(dateInput);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    function formatDateHeader(dateKey) {
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const [yyyy, mm, dd] = dateKey.split('-');
        const dateObj = new Date(parseInt(yyyy), parseInt(mm) - 1, parseInt(dd));
        return `${dd} ${months[parseInt(mm) - 1]} ${yyyy} - ${days[dateObj.getDay()]}`;
    }

    let expandedGroups = new Set();

        if (expandedGroups.has(dateKey)) {
            expandedGroups.delete(dateKey);

        const el = document.getElementById('group-' + dateKey);

    // Re-renders the current tab from window.expenseData only — no network call at all.
    // Used for optimistic updates so a local mutation shows instantly without racing

    function renderCurrentSectionFromCache() {

        if (!forceRefresh && window.expenseData) {
            return Promise.resolve({ data: window.expenseData, fromCache: true });
        }
        return fetch(`${url}?token=${encodeURIComponent(accessToken)}`).then(res => res.json()).then(data => {
            window.expenseData = data;
            return { data, fromCache: false };
        });
    }

    function refreshDataInBackground() {
        fetch(`${url}?token=${encodeURIComponent(accessToken)}`).then(res => res.json()).then(data => {
            const changed = JSON.stringify(data) !== JSON.stringify(window.expenseData);
            window.expenseData = data;
            if (!changed) return; // nothing new — skip re-render so nothing re-animates
            if (currentSection === 'expenses') renderExpensesList(data);
            else if (currentSection === 'insights') renderInsights(data);
        }).catch(() => {});

    // ---------- Generic period helpers (shared by Expenses & Insights tabs) ----------
    function getPeriodLabelFor(type, date) {
        if (type === 'all') return 'All';
        if (type === 'yearly') return String(date.getFullYear());
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        return `${monthNames[date.getMonth()]} ${date.getFullYear()}`;
    }

    function updatePeriodTypeButtonsGeneric(idPrefix, type) {
        ['Monthly', 'Yearly', 'All'].forEach(label => {
            const btn = document.getElementById(idPrefix + label);
            const t = label.toLowerCase();
            btn.classList.toggle('btn-primary', type === t);
            btn.classList.toggle('btn-outline-primary', type !== t);
        });
    }

    function getEarliestDateKey(data) {
        if (!data || data.length === 0) return null;
        let earliest = null;
        data.forEach(row => {
            const dateKey = toLocalDateKey(row.Date);
            if (!earliest || dateKey < earliest) earliest = dateKey;
        });
        return earliest;
    }

    function updatePeriodNavVisibilityGeneric(idPrefix, type, date, data) {
        const prevBtn = document.getElementById(idPrefix + 'Prev');
        const nextBtn = document.getElementById(idPrefix + 'Next');

        if (type === 'all') {
            prevBtn.style.visibility = 'hidden';
            nextBtn.style.visibility = 'hidden';
            return;
        }

        prevBtn.style.visibility = 'visible';
        nextBtn.style.visibility = 'visible';

        const earliestKey = getEarliestDateKey(data);
        const todayKey = toLocalDateKey(new Date());

        if (type === 'monthly') {
            const curKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
            const todayMonthKey = todayKey.slice(0, 7);
            if (curKey >= todayMonthKey) nextBtn.style.visibility = 'hidden';
            if (earliestKey && curKey <= earliestKey.slice(0, 7)) prevBtn.style.visibility = 'hidden';
        } else {
            const curYear = date.getFullYear();
            const todayYear = new Date().getFullYear();
            if (curYear >= todayYear) nextBtn.style.visibility = 'hidden';
            if (earliestKey && curYear <= parseInt(earliestKey.slice(0, 4))) prevBtn.style.visibility = 'hidden';
        }
    }

    function filterDataByPeriodGeneric(data, type, date) {
        if (type === 'all') return data;
        return data.filter(row => {
            const dateKey = toLocalDateKey(row.Date);
            const [yyyy, mm] = dateKey.split('-');
            if (type === 'yearly') {
                return parseInt(yyyy) === date.getFullYear();
            }
            return parseInt(yyyy) === date.getFullYear() && parseInt(mm) === (date.getMonth() + 1);
        });
    }

        const homeCurrencyRows = filtered.filter(r => (r.Currency || HOME_CURRENCY) === HOME_CURRENCY);

        const totals = {};
        EXPENSE_CATEGORIES.forEach(c => totals[c] = 0);
        homeCurrencyRows.forEach(row => {
            if (totals.hasOwnProperty(row.Category)) {
                totals[row.Category] += parseFloat(row.Amount);
            }
        });
        const grandTotal = Object.values(totals).reduce((a, b) => a + b, 0);
        const incomeTotal = homeCurrencyRows.filter(r => r.Category === 'Income').reduce((s, r) => s + parseFloat(r.Amount), 0);
        const savings = incomeTotal - grandTotal;

        document.getElementById('insExpTotalAmt').textContent = HOME_CURRENCY + ' ' + grandTotal.toFixed(2);
        document.getElementById('insIncTotalAmt').textContent = HOME_CURRENCY + ' ' + incomeTotal.toFixed(2);

        try { renderLunchIndicator(homeCurrencyRows); } catch (e) { console.error('Lunch indicator render failed:', e); }

        renderOtherCurrenciesSummary('insOtherCurrenciesList', filtered);
        renderConvertedSummary(filtered, { exp: 'insExpTotalAmtConverted', inc: 'insIncTotalAmtConverted', sav: 'insSavingsAmtConverted', note: 'insConvertedNote' });

        window.insightsOtherCurrencyTotals = computeOtherCurrencyCategoryTotals(filtered);

            applyInsightsChartForPage(2);
        }

        computeConvertedCategoryTotals(filtered).then(result => {
            window.insightsConvertedTotals = result;
            if (summaryPageState.ins === 0) {
                try { renderChartPair(result.totals, result.grandTotal, result.incomeTotal, HOME_CURRENCY); } catch (e) { console.error('Chart render failed:', e); }
                try { renderCategoryTable(result.totals, result.grandTotal, HOME_CURRENCY); } catch (e) { console.error('Category table render failed:', e); }
            }
        }).catch(e => console.error('Converted category totals failed:', e));
    }

    // Category totals for foreign-currency entries. Only meaningful (and only charted)
    // when exactly one foreign currency is present in the period, since combining raw
    // amounts across different currencies without conversion would be misleading.
    function computeOtherCurrencyCategoryTotals(periodRows) {
        const foreignRows = periodRows.filter(r => (r.Currency || HOME_CURRENCY) !== HOME_CURRENCY);
        if (foreignRows.length === 0) return { mode: 'none' };
        const currencies = Array.from(new Set(foreignRows.map(r => r.Currency))).sort();
        if (currencies.length > 1) {
            // Build a category x currency matrix (raw amounts, expenses only — never summed across currencies)
            const matrix = {}; // { category: { CUR: amount, ... }, ... }
            EXPENSE_CATEGORIES.forEach(c => { matrix[c] = {}; });
            foreignRows.forEach(row => {
                if (row.Category === 'Income') return;
                if (!matrix[row.Category]) matrix[row.Category] = {};
                matrix[row.Category][row.Currency] = (matrix[row.Category][row.Currency] || 0) + parseFloat(row.Amount);
            });
            return { mode: 'multiple', currencies: currencies, matrix: matrix };
        }
        const cur = currencies[0];
        const totals = {};
        EXPENSE_CATEGORIES.forEach(c => totals[c] = 0);
        foreignRows.forEach(row => {
            if (totals.hasOwnProperty(row.Category)) totals[row.Category] += parseFloat(row.Amount);
        });
        const grandTotal = Object.values(totals).reduce((a, b) => a + b, 0);
        const incomeTotal = foreignRows.filter(r => r.Category === 'Income').reduce((s, r) => s + parseFloat(r.Amount), 0);
        return { mode: 'single', currency: cur, totals: totals, grandTotal: grandTotal, incomeTotal: incomeTotal };
    }

    // Renders a Category x Currency matrix table — used instead of a pie chart when multiple
    // foreign currencies are present in the same period, since a pie can't honestly combine them.
    function renderCategoryByCurrencyMatrix(currencies, matrix) {
        const headEl = document.getElementById('categoryTableHead');
        const footEl = document.getElementById('categoryTableFoot');
        if (headEl) {
            headEl.innerHTML = '<tr><th class="text-start">Category</th>' +
                currencies.map(c => `<th class="text-end">${c}</th>`).join('') + '</tr>';
        }
        if (footEl) footEl.innerHTML = '';

        let rows = '';
        let anyData = false;
        EXPENSE_CATEGORIES.forEach(cat => {
            const rowValues = currencies.map(cur => (matrix[cat] && matrix[cat][cur]) || 0);
            if (rowValues.every(v => v === 0)) return; // skip categories with nothing in any currency
            anyData = true;
            rows += `<tr><td class="text-start">${getCategoryIcon(cat)} ${cat}</td>` +
                rowValues.map(v => `<td class="text-end">${v > 0 ? v.toFixed(2) : '-'}</td>`).join('') + '</tr>';
        });
        document.getElementById('categoryTableBody').innerHTML = anyData ? rows : `<tr><td colspan="${currencies.length + 1}" class="text-muted small text-center">No categorized expenses in these currencies.</td></tr>`;
    }

    async function computeConvertedCategoryTotals(periodRows) {
        const converted = await convertRowsToHomeCurrency(periodRows);
        const totals = {};
        EXPENSE_CATEGORIES.forEach(c => totals[c] = 0);
        converted.forEach(row => {
            if (row.ConvertedAmount != null && totals.hasOwnProperty(row.Category)) {
                totals[row.Category] += row.ConvertedAmount;
            }
        });
        const grandTotal = Object.values(totals).reduce((a, b) => a + b, 0);
        const incomeTotal = converted.filter(r => r.Category === 'Income' && r.ConvertedAmount != null).reduce((s, r) => s + r.ConvertedAmount, 0);
        return { totals: totals, grandTotal: grandTotal, incomeTotal: incomeTotal };
    }

    function applyInsightsChartForPage(idx) {
        const canvas = document.getElementById('primaryChartCanvas');
        const secondaryCanvas = document.getElementById('secondaryChartCanvas');
        const emptyMsg = document.getElementById('chartEmptyMsg');
        if (emptyMsg) emptyMsg.textContent = 'No data for this period yet.';

        if (idx === 0) {
            // Converted (overall SGD)
            if (window.insightsConvertedTotals) {
                const t = window.insightsConvertedTotals;
                try { renderChartPair(t.totals, t.grandTotal, t.incomeTotal, HOME_CURRENCY); } catch (e) { console.error('Chart render failed:', e); }
                try { renderCategoryTable(t.totals, t.grandTotal, HOME_CURRENCY); } catch (e) { console.error('Category table render failed:', e); }
            }
        } else if (idx === 1) {
            // Home currency (SGD) summary
            if (window.insightsSgdTotals) {
                const t = window.insightsSgdTotals;
                try { renderChartPair(t.totals, t.grandTotal, t.incomeTotal, HOME_CURRENCY); } catch (e) { console.error('Chart render failed:', e); }
                try { renderCategoryTable(t.totals, t.grandTotal, HOME_CURRENCY); } catch (e) { console.error('Category table render failed:', e); }
            }
        } else {
            // Other currencies
            const info = window.insightsOtherCurrencyTotals;
            if (!info || info.mode === 'none') {
                const chartArea = document.getElementById('insightsChartArea');
                if (chartArea) chartArea.style.display = '';
                if (canvas) Chart.getChart(canvas) && Chart.getChart(canvas).destroy();
                if (secondaryCanvas) Chart.getChart(secondaryCanvas) && Chart.getChart(secondaryCanvas).destroy();
                if (canvas) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
                if (secondaryCanvas) secondaryCanvas.getContext('2d').clearRect(0, 0, secondaryCanvas.width, secondaryCanvas.height);
                if (emptyMsg) { emptyMsg.textContent = 'No other-currency entries in this period.'; emptyMsg.style.display = 'block'; }
                const headEl = document.getElementById('categoryTableHead');
                const footEl = document.getElementById('categoryTableFoot');
                if (headEl) headEl.innerHTML = '<tr><th class="text-start">Category</th><th class="text-end">Spent</th><th class="text-end">Budget</th></tr>';
                if (footEl) footEl.innerHTML = '<tr class="fw-bold"><td class="text-start">Total</td><td class="text-end" colspan="2" id="insightsTotal"></td></tr>';
                document.getElementById('categoryTableBody').innerHTML = '';
                document.getElementById('insightsTotal').textContent = '-';
            } else if (info.mode === 'multiple') {
                const chartArea = document.getElementById('insightsChartArea');
                if (chartArea) chartArea.style.display = 'none';
                if (emptyMsg) emptyMsg.style.display = 'none';
                renderCategoryByCurrencyMatrix(info.currencies, info.matrix);
            } else {
                try { renderChartPair(info.totals, info.grandTotal, info.incomeTotal, info.currency); } catch (e) { console.error('Chart render failed:', e); }
                try { renderCategoryTable(info.totals, info.grandTotal, info.currency); } catch (e) { console.error('Category table render failed:', e); }
            }
        }
    }

    let primaryChartType = 'expenses'; // 'expenses' | 'overview'

    function swapPrimaryChart() {
        primaryChartType = primaryChartType === 'expenses' ? 'overview' : 'expenses';
        renderInsightsFromCache();
    }

    function chartLabelFor(type) {
        return type === 'expenses' ? 'Expense Breakdown' : 'Savings vs Expenses';
    }

    function buildChartData(type, totals, grandTotal, incomeTotal) {
        if (type === 'expenses') {
            const labels = [], values = [], colors = [];
            EXPENSE_CATEGORIES.forEach(c => {
                if (totals[c] > 0) {
                    labels.push(c);
                    values.push(totals[c]);
                    colors.push(categoryColors[c] || '#9CA3AF');
                }
            });
            return { labels, values, colors };
        }
        const savings = incomeTotal - grandTotal;
        if (savings >= 0) {
            return { labels: ['Savings', 'Expenses'], values: [savings, grandTotal], colors: ['#34D399', '#F87171'] };
        }
        return { labels: ['Expenses'], values: [grandTotal], colors: ['#F87171'] };
    }

    function drawChartToCanvas(canvasId, type, totals, grandTotal, incomeTotal, isPrimary, currencyLabel) {
        currencyLabel = currencyLabel || HOME_CURRENCY;
        const canvas = document.getElementById(canvasId);
        const existing = Chart.getChart(canvas);
        if (existing) existing.destroy();

        const { labels, values, colors } = buildChartData(type, totals, grandTotal, incomeTotal);

        if (values.length === 0 || values.every(v => v === 0)) {
            canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
            return false;
        }

        const pieTotal = values.reduce((a, b) => a + b, 0);

        new Chart(canvas.getContext('2d'), {
            type: 'pie',
            data: { labels: labels, datasets: [{ data: values, backgroundColor: colors, borderColor: '#121417', borderWidth: isPrimary ? 2 : 1 }] },
            options: {
                maintainAspectRatio: false,
                animation: isPrimary ? {} : false,
                plugins: {
                    legend: { display: isPrimary, position: 'bottom', labels: { color: '#e4e6eb', boxWidth: 10, font: { size: 10 } } },
                    tooltip: {
                        enabled: isPrimary,
                        callbacks: {
                            label: function (context) {
                                const val = context.parsed;
                                const pct = pieTotal > 0 ? ((val / pieTotal) * 100).toFixed(1) : '0.0';
                                return `${context.label}: ${currencyLabel} ${val.toFixed(2)} (${pct}%)`;
                            }
                        }
                    }
                }
            }
        });
        return true;
    }

    function renderChartPair(totals, grandTotal, incomeTotal, currencyLabel) {
        currencyLabel = currencyLabel || HOME_CURRENCY;
        const chartArea = document.getElementById('insightsChartArea');
        if (chartArea) chartArea.style.display = '';
        const secondaryType = primaryChartType === 'expenses' ? 'overview' : 'expenses';

        document.getElementById('primaryChartLabel').textContent = chartLabelFor(primaryChartType);

        const primaryHasData = drawChartToCanvas('primaryChartCanvas', primaryChartType, totals, grandTotal, incomeTotal, true, currencyLabel);
        drawChartToCanvas('secondaryChartCanvas', secondaryType, totals, grandTotal, incomeTotal, false, currencyLabel);

        document.getElementById('chartEmptyMsg').style.display = primaryHasData ? 'none' : 'block';

        const savings = incomeTotal - grandTotal;
        const noteEl = document.getElementById('overspendNote');
        if (savings < 0 && (grandTotal > 0 || incomeTotal > 0)) {
            noteEl.textContent = `⚠️ Over budget by ${currencyLabel} ${Math.abs(savings).toFixed(2)} this period.`;
            noteEl.style.display = 'block';
        } else {
            noteEl.style.display = 'none';
        }
    }

    function renderCategoryTable(totals, grandTotal, currencyLabel) {
        currencyLabel = currencyLabel || HOME_CURRENCY;
        const isHome = currencyLabel === HOME_CURRENCY;

        // Restore the standard 3-column layout in case the multi-currency matrix view replaced it
        const headEl = document.getElementById('categoryTableHead');
        const footEl = document.getElementById('categoryTableFoot');
        if (headEl) headEl.innerHTML = '<tr><th class="text-start">Category</th><th class="text-end">Spent</th><th class="text-end">Budget</th></tr>';
        if (footEl) footEl.innerHTML = '<tr class="fw-bold"><td class="text-start">Total</td><td class="text-end" colspan="2" id="insightsTotal"></td></tr>';

        const budgets = isHome ? loadBudgets() : {};
        let rows = '';
        EXPENSE_CATEGORIES.forEach(c => {
            const spent = totals[c] || 0;
            const budget = isHome ? (budgets[c] || 0) : 0;
            const pct = grandTotal > 0 ? ((spent / grandTotal) * 100).toFixed(1) : '0.0';
            const overBudget = isHome && budget > 0 && spent > budget;
            rows += `<tr>
                <td class="text-start">${getCategoryIcon(c)} ${c}</td>
                <td class="text-end">${currencyLabel} ${spent.toFixed(2)}<br><small class="text-muted">${pct}%</small></td>
                <td class="text-end ${overBudget ? 'text-danger fw-bold' : ''}">${isHome ? (budget > 0 ? currencyLabel + ' ' + budget.toFixed(2) : '-') : 'N/A'}</td>
            </tr>`;
        });
        document.getElementById('categoryTableBody').innerHTML = rows;
        document.getElementById('insightsTotal').textContent = currencyLabel + ' ' + grandTotal.toFixed(2);
    }

    function renderLunchIndicator(filtered) {
        const lunchItems = filtered.filter(row => {
            const desc = (row.Description || '').toString().trim();
            return desc.toLowerCase().includes('lunch') || desc.includes('午餐');
        });
        const bigEl = document.getElementById('lunchAvgBig');
        const subEl = document.getElementById('lunchAvgSubtext');
        if (lunchItems.length === 0) {
            bigEl.textContent = '—';
            subEl.textContent = 'No lunch entries found for this period.';
            return;
        }
        const total = lunchItems.reduce((sum, r) => sum + parseFloat(r.Amount), 0);
        const avg = total / lunchItems.length;
        bigEl.textContent = `${HOME_CURRENCY} ${avg.toFixed(2)}`;
        subEl.textContent = `Across ${lunchItems.length} ${lunchItems.length === 1 ? 'entry' : 'entries'} (total ${HOME_CURRENCY} ${total.toFixed(2)})`;
    }

    let startX = 0;
    let startY = 0;
    let dragActive = false;
    let horizontalSwipe = false;

    function startTouch(e) {
        startX = e.changedTouches[0].screenX;
        startY = e.changedTouches[0].screenY;
        dragActive = true;
        horizontalSwipe = false;
    }

    function dragTouch(e) {
        if (!dragActive) return;
        const touch = e.changedTouches[0];
        const dx = touch.screenX - startX;
        const dy = touch.screenY - startY;
        if (!horizontalSwipe) {
            // Wait for a small, unambiguous movement before deciding the gesture direction
            if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
            horizontalSwipe = Math.abs(dx) > Math.abs(dy);
            if (!horizontalSwipe) return; // vertical drag: let the page scroll normally
        }
        // Horizontal swipe confirmed: stop the page itself from scrolling/rubber-banding
        e.preventDefault();
    }

    function endTouch(e) {
        dragActive = false;
        let diff = startX - e.changedTouches[0].screenX;
        let container = e.currentTarget.querySelector('.item-container');
        diff > 50 ? container.classList.add('swiped') : container.classList.remove('swiped');
    }

    initAccess();
</script>
